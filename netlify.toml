# Netlify config for the CRM FRONTEND (Next.js 16). Repo root = this folder.
# Deliberately minimal: Netlify auto-detects Next.js and installs its own runtime. Hardcoding `publish` or the
# plugin made Netlify publish the build as static files, so server routes like /api/auth/login returned 404.
# Set CRM_API_URL in Netlify -> Site configuration -> Environment variables (see DEPLOY.md).
[build]
  base = "crm_frontend"

[build.environment]
  NODE_VERSION = "20"
