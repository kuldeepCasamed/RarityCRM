# Netlify config for the CRM FRONTEND (Next.js 16). Repo root = this folder.
# The Next.js runtime is declared explicitly (and installed via crm_frontend/package.json) so the server routes
# (/api/*, login proxy) are always deployed as functions, regardless of dashboard settings or auto-detection.
# Set CRM_API_URL in Netlify -> Site configuration -> Environment variables (see DEPLOY.md).
[build]
  base = "crm_frontend"
  command = "npm run build"
  publish = ".next"   # relative to base (crm_frontend). Required: the Next.js plugin refuses publish == base.

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
