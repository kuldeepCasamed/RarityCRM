# Netlify config for the CRM FRONTEND (Next.js 16). Repo root = this folder.
# Set CRM_API_URL in Netlify -> Site settings -> Environment variables (see DEPLOY.md).
[build]
  base = "crm_frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
